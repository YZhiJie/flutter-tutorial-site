      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>

  <rect x="20" y="16" width="92" height="36" rx="8" fill="#7C3AED"/>
  <text x="66" y="41" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.01</text>
  <text x="128" y="43" font-size="26" font-weight="bold" fill="url(#titleGrad)">问号满天飞 · var / final / const</text>
  <text x="1180" y="41" text-anchor="end" font-size="13" fill="#64748b">Flutter 漫画剧场</text>
  <rect x="20" y="62" width="1160" height="2" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#1e2a44"/>
    <polygon points="420,0 480,0 200,361 140,361" fill="#22d3ee" opacity="0.05"/>
    <rect x="14" y="12" width="26" height="26" rx="6" fill="#22d3ee"/>
    <text x="27" y="31" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="32" font-size="17" font-weight="bold" fill="#e2e8f0">困境 · 问号满天飞</text>

    <rect x="124" y="56" width="296" height="76" rx="10" fill="#f8fafc"/>
    <polygon points="140,132 100,220 162,132" fill="#f8fafc"/>
    <text x="140" y="84" font-size="15" fill="#0b1220">帧叔！这 String? 里的问号，</text>
    <text x="140" y="108" font-size="15" fill="#0b1220">是在夸我，还是在骂我？</text>

    <circle cx="88" cy="240" r="17" fill="#ffd9b3"/>
    <path d="M71,240 a17,17 0 0 1 34,0 q-2,-12 -17,-12 q-15,0 -17,12 z" fill="#22d3ee"/>
    <polygon points="84,224 90,212 96,224" fill="#22d3ee"/>
    <circle cx="82" cy="240" r="2.2" fill="#0b1220"/>
    <circle cx="94" cy="240" r="2.2" fill="#0b1220"/>
    <path d="M84,248 q4,4 8,0" stroke="#0b1220" stroke-width="1.4" fill="none"/>
    <rect x="71" y="255" width="34" height="42" rx="10" fill="#f8fafc"/>
    <polygon points="88,272 82,266 88,268 94,266" fill="#f472b6"/>

    <rect x="268" y="158" width="272" height="52" rx="10" fill="#f8fafc"/>
    <polygon points="470,210 464,232 492,210" fill="#f8fafc"/>
    <text x="284" y="180" font-size="15" fill="#0b1220">还有 required 关键字，</text>
    <text x="284" y="202" font-size="15" fill="#0b1220">装环境时可没见过！</text>

    <circle cx="460" cy="236" r="7" fill="#f472b6"/>
    <circle cx="488" cy="236" r="7" fill="#f472b6"/>
    <circle cx="474" cy="250" r="17" fill="#ffd9b3"/>
