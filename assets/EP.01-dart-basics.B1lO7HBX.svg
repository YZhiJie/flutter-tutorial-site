    <circle cx="480" cy="250" r="2.2" fill="#0b1220"/>
    <path d="M470,258 q4,4 8,0" stroke="#0b1220" stroke-width="1.4" fill="none"/>
    <rect x="457" y="265" width="34" height="42" rx="10" fill="#f97316"/>
    <rect x="466" y="276" width="9" height="9" rx="2" fill="#fbbf24"/>
    <rect x="472" y="282" width="9" height="9" rx="2" fill="#22d3ee"/>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#1e2a44"/>
    <polygon points="60,0 120,0 400,361 340,361" fill="#a78bfa" opacity="0.05"/>
    <rect x="14" y="12" width="26" height="26" rx="6" fill="#7C3AED"/>
    <text x="27" y="31" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
    <text x="50" y="32" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘 · 声明三板斧</text>

    <circle cx="84" cy="86" r="17" fill="#ffd9b3"/>
    <path d="M67,86 a17,17 0 0 1 34,0 q-2,-10 -17,-10 q-15,0 -17,10 z" fill="#e2e8f0"/>
    <circle cx="78" cy="86" r="5.5" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
    <circle cx="90" cy="86" r="5.5" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
    <path d="M83,86 L85,86" stroke="#94a3b8" stroke-width="1.6"/>
    <circle cx="78" cy="86" r="1.4" fill="#0b1220"/>
    <circle cx="90" cy="86" r="1.4" fill="#0b1220"/>
    <path d="M76,94 q8,10 16,0 q-2,10 -8,10 q-6,0 -8,-10 z" fill="#e2e8f0"/>
    <rect x="66" y="101" width="36" height="44" rx="10" fill="#cbd5e1"/>
    <rect x="96" y="110" width="20" height="26" rx="3" fill="#0ea5e9"/>
    <rect x="99" y="115" width="14" height="2" fill="#f8fafc" opacity="0.8"/>
    <rect x="99" y="120" width="11" height="2" fill="#f8fafc" opacity="0.6"/>

    <rect x="136" y="48" width="400" height="56" rx="10" fill="#f8fafc"/>
    <polygon points="150,104 100,92 160,94" fill="#f8fafc"/>
    <text x="152" y="72" font-size="15" fill="#0b1220">三板斧记牢：var 自动推断、</text>
    <text x="152" y="94" font-size="15" fill="#0b1220">final 只赋一次、const 编译期定死。</text>

    <rect x="36" y="126" width="500" height="152" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="52" y="154" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">var name = 'Flutter';  // 自动推断 String</text>
    <text x="52" y="181" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">final year = 2026;     // 运行期只赋值一次</text>
    <text x="52" y="208" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">const pi = 3.14159;    // 编译期常量</text>
    <text x="52" y="235" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">String? nick;          // 可空：编译器盯着</text>
    <text x="52" y="262" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">print(nick ?? '暂无'); // 空合并给兜底值</text>
    <text x="36" y="300" font-size="12" fill="#64748b">可空变量使用前必须判空或给兜底，这是空安全的核心。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#1e2a44"/>
    <polygon points="400,0 460,0 180,361 120,361" fill="#f472b6" opacity="0.05"/>
    <rect x="14" y="12" width="26" height="26" rx="6" fill="#f472b6"/>
    <text x="27" y="31" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="32" font-size="17" font-weight="bold" fill="#e2e8f0">实证 · const 翻车现场</text>

    <rect x="36" y="64" width="238" height="96" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="52" y="92" font-size="13" font-weight="bold" fill="#f472b6">错误示范</text>
    <text x="52" y="120" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">const now =</text>
    <text x="52" y="142" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  DateTime.now();</text>

    <circle cx="287" cy="112" r="16" fill="#1e2a44"/>
    <text x="287" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#fbbf24">VS</text>

    <rect x="300" y="64" width="238" height="96" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="316" y="92" font-size="13" font-weight="bold" fill="#34d399">正确写法</text>
    <text x="316" y="120" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">final now =</text>
    <text x="316" y="142" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  DateTime.now();</text>

    <rect x="124" y="190" width="400" height="56" rx="10" fill="#f8fafc"/>
    <polygon points="140,246 102,252 160,246" fill="#f8fafc"/>
    <text x="140" y="214" font-size="15" fill="#0b1220">now() 是运行期才算出来的值，</text>
    <text x="140" y="236" font-size="15" fill="#0b1220">const 接不住，换 final 就对了！</text>

    <circle cx="88" cy="262" r="17" fill="#ffd9b3"/>
    <path d="M71,262 a17,17 0 0 1 34,0 q-2,-12 -17,-12 q-15,0 -17,12 z" fill="#22d3ee"/>
    <polygon points="84,246 90,234 96,246" fill="#22d3ee"/>
    <circle cx="82" cy="262" r="2.2" fill="#0b1220"/>
    <circle cx="94" cy="262" r="2.2" fill="#0b1220"/>
    <path d="M84,270 q4,4 8,0" stroke="#0b1220" stroke-width="1.4" fill="none"/>
    <rect x="71" y="277" width="34" height="42" rx="10" fill="#f8fafc"/>
    <polygon points="88,294 82,288 88,290 94,288" fill="#f472b6"/>

    <rect x="320" y="296" width="190" height="36" rx="10" fill="#f8fafc"/>
    <polygon points="470,296 462,270 492,296" fill="#f8fafc"/>
    <text x="336" y="319" font-size="14" fill="#0b1220">懂了，这就去改！</text>

    <circle cx="460" cy="248" r="7" fill="#f472b6"/>
    <circle cx="488" cy="248" r="7" fill="#f472b6"/>
    <circle cx="474" cy="262" r="17" fill="#ffd9b3"/>
    <path d="M457,262 a17,17 0 0 1 34,0 q-2,-11 -17,-11 q-15,0 -17,11 z" fill="#f472b6"/>
    <circle cx="468" cy="262" r="2.2" fill="#0b1220"/>
    <circle cx="480" cy="262" r="2.2" fill="#0b1220"/>
    <path d="M470,270 q4,4 8,0" stroke="#0b1220" stroke-width="1.4" fill="none"/>
    <rect x="457" y="277" width="34" height="42" rx="10" fill="#f97316"/>
    <rect x="466" y="288" width="9" height="9" rx="2" fill="#fbbf24"/>
    <rect x="472" y="294" width="9" height="9" rx="2" fill="#22d3ee"/>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#1e2a44"/>
    <polygon points="80,0 140,0 420,361 360,361" fill="#f97316" opacity="0.05"/>
    <rect x="14" y="12" width="26" height="26" rx="6" fill="#f97316"/>
    <text x="27" y="31" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="32" font-size="17" font-weight="bold" fill="#e2e8f0">结案 · 类型是护栏</text>

    <rect x="36" y="60" width="500" height="104" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="52" y="90" font-size="13" fill="#34d399">✓ 能 final 不 var，能 const 不 final</text>
    <text x="52" y="120" font-size="13" fill="#34d399">✓ Widget 构造参数，优先命名参数 { }</text>
    <text x="52" y="150" font-size="13" fill="#f472b6">✗ 运行期的值，别用 const 接</text>

    <rect x="36" y="180" width="500" height="36" rx="8" fill="#f97316" opacity="0.14"/>
    <rect x="36" y="180" width="6" height="36" fill="#f97316"/>
    <text x="58" y="204" font-size="13" fill="#f97316">⚠ 坑点：[ ] 可选位置参数，{ } 命名参数，混用编译报错</text>

    <rect x="130" y="238" width="406" height="56" rx="10" fill="#f8fafc"/>
    <polygon points="146,294 100,288 166,294" fill="#f8fafc"/>
    <text x="146" y="262" font-size="15" fill="#0b1220">类型不是枷锁，是护栏——</text>
    <text x="146" y="284" font-size="15" fill="#0b1220">下一话：把开发环境装起来！</text>

    <circle cx="84" cy="282" r="17" fill="#ffd9b3"/>
    <path d="M67,282 a17,17 0 0 1 34,0 q-2,-10 -17,-10 q-15,0 -17,10 z" fill="#e2e8f0"/>
