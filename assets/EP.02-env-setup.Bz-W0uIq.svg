    <text x="52" y="244" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">export PUB_HOSTED_URL=https://pub.flutter-io.cn</text>
    <text x="52" y="266" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn</text>
    <text x="36" y="306" font-size="12" fill="#64748b">配完重新打开终端，让变量生效。</text>
